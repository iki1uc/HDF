<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>ID · HDF · iki1uc</title>

<style>
body { background:#000; color:#0f0; font-family:monospace; padding:40px; }
h1 { color:#6cf; letter-spacing:4px; margin-bottom:30px; }
.block { background:#111; border:1px solid #333; padding:25px; margin-bottom:30px; border-radius:8px; }
pre { background:#000; border-left:3px solid #6cf; padding:15px; margin-top:10px; white-space:pre-wrap; }
</style>

<script src="IDkoop.js"></script>
<script src="IDneutral.js"></script>
<script src="IDpook.js"></script>

</head>
<body>

<h1>ID · HDF · iki1uc</h1>

<div class="block">
    <div class="title">ID‑Modus</div>
    <pre id="id"></pre>
</div>

<div class="block">
    <div class="title">ID‑HDF‑Status</div>
    <pre id="hdf"></pre>
</div>

<script>
(async function () {

    /* ID‑Modus bestimmen */
    let mode = "neutral";
    if (ID_KOOP?.active) mode = "koop";
    if (ID_POOK?.active) mode = "pook";

    const map = {
        koop: ID_KOOP,
        neutral: ID_NEUTRAL,
        pook: ID_POOK
    };

    document.getElementById("id").innerText =
        `Modus: ${mode.toUpperCase()}\nInfo: ${map[mode].info()}`;

    /* HDF‑ID‑Integration */
    const idHdf = await fetch("ID.room").then(r => r.text()).catch(() => "Keine ID.room gefunden");
    document.getElementById("hdf").innerText = idHdf;

})();
</script>

</body>
</html>
